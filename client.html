        /* ==================== 全新 Pagefind 搜索样式（搜索框水平居中版） ==================== */
.search-container {
    position: relative;
    /* 删除 margin-right，改为自动左右 margin 实现居中 */
    margin: 0 auto;           /* 关键：水平居中 */
    z-index: 1001;
    min-width: 200px;
    max-width: 380px;         /* 建议加上最大宽度，和下拉结果保持一致 */
    width: 100%;
    display: flex;
    justify-content: center;  /* 内部元素水平居中 */
    align-items: center;
}

/* 输入框：去掉宽度 100% + focus 扩展的左右晃动问题 */
#pagefind-search .pagefind-ui__search-input {
    padding: 10px 16px;
    border: 2px solid #ddd;
    border-radius: 25px;
    font-size: 16px;
    /* 固定宽度，或者使用 min-width + max-width 防止晃动 */
    width: 300px;                     /* 固定一个舒适的宽度 */
    max-width: 100%;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    background: white;
    color: #333;
    box-sizing: border-box;
    outline: none;
}

#pagefind-search .pagefind-ui__search-input:focus {
    border-color: #4a6fa5;
    box-shadow: 0 0 0 4px rgba(74, 111, 165, 0.2);
    /* focus 时不再改变宽度，避免整个搜索框左右晃动 */
}

/* 下拉结果：从右对齐改为居中对齐 */
#pagefind-search .pagefind-ui__results {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    position: absolute;
    top: 100%;
    left: 50%;                        /* 关键：左边 50% */
    transform: translateX(-50%);      /* 关键：向左偏移自身宽度的一半 → 完全居中 */
    right: auto;                      /* 取消原来的 right: 0 */
    width: 380px;
    max-height: 70vh;
    overflow-y: auto;
    margin-top: 8px;
    z-index: 1000;
    padding: 8px 0;
}

/* 其余样式保持不变 */
#pagefind-search .pagefind-ui__result {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    transition: background-color 0.2s;
}
#pagefind-search .pagefind-ui__result:last-child { border-bottom: none; }
#pagefind-search .pagefind-ui__result:hover { background-color: #f8f9ff; }
#pagefind-search .pagefind-ui__result-title { font-size: 15px; font-weight: 600; color: #1f2937; margin-bottom: 4px; }
#pagefind-search .pagefind-ui__result-link {

}
#pagefind-search .pagefind-ui__result-link:hover { text-decoration: underline; }
#pagefind-search .pagefind-ui__result-excerpt { font-size: 13.5px; color: #666; line-height: 1.5; margin-top: 4px; }

#pagefind-search .pagefind-ui__message { padding: 20px; text-align: center; color: #666; font-size: 14px; }
    /* 移动端底部导航样式 */

      position: fixed;

    }

    .nav-item {

      align-items: center;

    .nav-item i {

    @media (max-width: 768px) {
      .mobile-nav {
        display: block;
      }

    /* 导航栏样式 */
    .navbar {
      background-color: rgba(255, 255, 255, 0.98);

    .nav-container {

      cursor: pointer;
      gap: 5px;

      height: 3px;
      background-color: #2c3e50;
      border-radius: 3px;
      transition: 0.3s;
    }

    /* 主要内容区 */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 30px 60px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 0.8s ease;
    }

    .page-title {

      color: white;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);

    .page-subtitle {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 300;
    }

    /* 下载区块 */
    .download-section {
      margin-bottom: 50px;
      animation: fadeInUp 0.8s ease;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 35px;
      padding-left: 10px;
    }

    .section-icon {
      font-size: 2rem;
      color: white;
    }

    .section-title {
      font-size: 2rem;
      color: white;
      font-weight: 600;
      margin: 0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .download-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .download-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #3498db, #2ecc71);
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    .download-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .download-card:hover::before {
      transform: scaleX(1);
    }

    .os-icon {
      font-size: 4rem;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #3498db, #2ecc71);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: transform 0.3s ease;
    }

    .download-card:hover .os-icon {
      transform: scale(1.1) rotate(5deg);
    }

    .card-title {
      font-size: 1.75rem;
      margin-bottom: 25px;
      color: #2c3e50;
      font-weight: 600;
    }

    .download-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
    }

    .download-link:hover {
      background: linear-gradient(135deg, #2980b9, #21618c);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
    }

    .download-link i {
      font-size: 18px;
    }

    .qr-section {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .qr-code {
      max-width: 180px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .qr-code:hover {
      transform: scale(1.05);
    }

    /* 页脚 */
    .footer {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 15px;
      margin-top: 60px;
    }

    /* 动画 */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 响应式设计 */
    @media (max-width: 1024px) {
      .nav-menu {
        position: fixed;
        left: -100%;
        top: 60px;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.98);
        width: 100%;
        text-align: center;
        transition: left 0.3s ease-in-out;
        box-shadow: 0 10px 27px rgba(0, 0, 0, 0.3);
        padding: 20px 0;
        z-index: 999;
        gap: 0.5rem;
      }

      .nav-menu li {
        padding: 10px 0;
      }

      .nav-menu.active {
        left: 0;
      }

      .hamburger {
        display: flex;
      }

      .hamburger.active .bar:nth-child(1) {
        transform: translateY(8px) rotate(45deg);
      }

      .hamburger.active .bar:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active .bar:nth-child(3) {
        transform: translateY(-8px) rotate(-45deg);
      }

      .cards-grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding-top: 70px;
      }

      .nav-container {
        padding: 0 20px;
        height: 60px;
      }

      .main-content {

      .page-subtitle {
        font-size: 1rem;
      }

      .section-title {
        font-size: 1.6rem;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .download-card {
        padding: 35px 25px;
      }
    }

    @media (max-width: 480px) {
      .page-title {
        font-size: 1.8rem;
      }

      .section-title {
        font-size: 1.4rem;
      }

      .card-title {
        font-size: 1.5rem;
      }

      .os-icon {
        font-size: 3rem;
      }

      .download-link {
        padding: 12px 20px;
        font-size: 14px;
      }
    }

  </style>

        function toggleSearchModal() {
            const modal = document.getElementById('searchModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function closeSearchModal(event) {
            document.getElementById('searchModal').style.display = 'none';
        }

        // 微信弹窗控制函数
        function toggleWechatModal() {
            const modal = document.getElementById('wechatModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function closeWechatModal(event) {
            document.getElementById('wechatModal').style.display = 'none';
        }

        // 点击模态背景关闭
        window.onclick = function(event) {
            const searchModal = document.getElementById('searchModal');
            const wechatModal = document.getElementById('wechatModal');
            
            if (event.target === searchModal) {
                closeSearchModal();
            } else if (event.target === wechatModal) {
                closeWechatModal();
            }
        };
    </script>
