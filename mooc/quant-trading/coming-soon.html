<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="https://cf.aibochinese.com/%E7%B4%A0%E6%9D%90%E7%AB%99/202609/aibo-blog-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教程开发中 - 爱博·客公开课</title>
    <meta name="description" content="本教程页面正在开发中">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 60px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .icon {
            font-size: 4rem;
            color: #00f0ff;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00f0ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #00f0ff, #a855f7);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
        }
        
        .status {
            display: inline-block;
            background: #f59e0b;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fas fa-tools"></i>
        </div>
        
        <div class="status">🚧 开发中</div>
        
        <h1>课程页面开发中</h1>
        
        <p>
            本教程页面正在积极开发中，我们的团队正在努力完善内容。<br>
            预计将在近期发布完整的教程内容。
        </p>
        
        <p>
            在此期间，您可以：
        </p>
        
        <ul style="text-align: left; color: rgba(255,255,255,0.8); margin-bottom: 30px; display: inline-block;">
            <li>查看其他已经完成的教程页面</li>
            <li>学习基础的量化交易知识</li>
            <li>关注我们的更新通知</li>
        </ul>
        
        <div style="margin-top: 40px;">
            <a href="index.html" class="btn">返回课程主页</a>
            <a href="/mooc/quant-trading/index.html" class="btn btn-secondary">量化交易课程</a>
        </div>
    </div>
</body>
</html>
