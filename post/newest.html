/* ==================== 全新 Pagefind 搜索样式（搜索框水平居中版） ==================== */
.search-container {
    position: relative;
    /* 删除 margin-right，改为自动左右 margin 实现居中 */
    margin: 0 auto;           /* 关键：水平居中 */
    z-index: 1001;
    min-width: 200px;
    max-width: 380px;         /* 建议加上最大宽度，和下拉结果保持一致 */
    width: 100%;
    display: flex;
    justify-content: center;  /* 内部元素水平居中 */
    align-items: center;
}

/* 输入框：去掉宽度 100% + focus 扩展的左右晃动问题 */
#pagefind-search .pagefind-ui__search-input {
    padding: 10px 16px;
    border: 2px solid #ddd;
    border-radius: 25px;
    font-size: 16px;
    /* 固定宽度，或者使用 min-width + max-width 防止晃动 */
    width: 300px;                     /* 固定一个舒适的宽度 */
    max-width: 100%;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    background: white;
    color: #333;
    box-sizing: border-box;
    outline: none;
}

#pagefind-search .pagefind-ui__search-input:focus {
    border-color: #4a6fa5;
    box-shadow: 0 0 0 4px rgba(74, 111, 165, 0.2);
    /* focus 时不再改变宽度，避免整个搜索框左右晃动 */
}

/* 下拉结果：从右对齐改为居中对齐 */
#pagefind-search .pagefind-ui__results {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    position: absolute;
    top: 100%;
    left: 50%;                        /* 关键：左边 50% */
    transform: translateX(-50%);      /* 关键：向左偏移自身宽度的一半 → 完全居中 */
    right: auto;                      /* 取消原来的 right: 0 */
    width: 380px;
    max-height: 70vh;
    overflow-y: auto;
    margin-top: 8px;
    z-index: 1000;
    padding: 8px 0;
}

/* 其余样式保持不变 */
#pagefind-search .pagefind-ui__result {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;

}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            const navLinks = document.querySelectorAll('.nav-link');

            hamburger.addEventListener('click', function() {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                });
            });
            
            // 移动端底部导航交互
            const navItems = document.querySelectorAll('.fixed.bottom-0 a:not(:nth-child(3))');
            
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    // 移除所有激活状态
                    navItems.forEach(i => i.classList.remove('nav-item-active'));
                    // 给当前点击项添加激活状态
                    e.currentTarget.classList.add('nav-item-active');
                });
            });
        });
    </script>

            <i class="fa fa-search text-white text-2xl"></i>
        </div>
    </div>

    <!-- 搜索弹出窗 -->
    <div id="searchModal" class="search-modal" onclick="closeSearchModal(event)">
        <div class="search-popup" onclick="event.stopPropagation()">
            <h3>搜索内容</h3>
            <div id="pagefind-search-popup"></div>
            <button class="close-btn" onclick="closeSearchModal()">关闭</button>
        </div>
    </div>

    <!-- 微信弹出窗 -->
    <div id="wechatModal" class="wechat-modal" onclick="closeWechatModal(event)">
        <div class="wechat-popup" onclick="event.stopPropagation()">
            <h3>微信客服</h3>
            <img src="https://cf.aibochinese.com/%E7%88%B1%E5%8D%9A%C2%B7%E5%AE%A2%E5%9B%BE%E7%89%87%E5%BA%93/%E6%B7%BB%E5%8A%A0%E5%BE%AE%E4%BF%A1.png" alt="微信二维码" class="wechat-qr">
            <p>扫描添加客服微信</p>
            <button class="close-btn" onclick="closeWechatModal()">关闭</button>
        </div>
    </div>

    <script>
        // 搜索弹窗控制函数
        function toggleSearchModal() {
            const modal = document.getElementById('searchModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function closeSearchModal(event) {
            document.getElementById('searchModal').style.display = 'none';
        }

        // 微信弹窗控制函数
        function toggleWechatModal() {
            const modal = document.getElementById('wechatModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function closeWechatModal(event) {
            document.getElementById('wechatModal').style.display = 'none';
        }

        // 点击模态背景关闭
        window.onclick = function(event) {
            const searchModal = document.getElementById('searchModal');
            const wechatModal = document.getElementById('wechatModal');
            
            if (event.target === searchModal) {
                closeSearchModal();
            } else if (event.target === wechatModal) {
                closeWechatModal();
            }
        };
    </script>
