<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | 爱博·客</title>
    <meta name="description" content="抱歉，您访问的页面不存在">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 { font-size: 120px; font-weight: 900; margin-bottom: 10px; text-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        h2 { font-size: 28px; margin-bottom: 20px; font-weight: 600; }
        p { font-size: 16px; margin-bottom: 30px; opacity: 0.9; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0,0,0,0.3);
        }
        .emoji { font-size: 60px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔍</div>
        <h1>404</h1>
        <h2>哎呀，页面走丢了</h2>
        <p>您访问的页面可能已被删除、改名或暂时不可用。<br>请检查网址是否输入正确，或返回首页继续浏览。</p>
        <a href="https://blog.aibochinese.com/" class="btn">← 返回首页</a>
    </div>
</body>
</html>
